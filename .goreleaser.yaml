
version: 2

project_name: tcopy

builds:
  - id: tcopy
    main: ./cmd/tcopy
    binary: tcopy
    ldflags:
      - -s -w -X github.com/ak-repo/tcopy/internal/cli.Version={{.Tag}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: linux
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
