
version: 2

project_name: tcopy

builds:
  - id: tcopy
    main: ./cmd/tcopy
    binary: tcopy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: linux
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

nfpms:
  - id: linux-packages
    package_name: tcopy
    maintainer: "Your Name <your-email@example.com>"
    vendor: tcopy
    description: "Copy terminal commands and their output to the clipboard"
    license: MIT
    bindir: /usr/bin
    formats:
      - deb
      - rpm
      - archlinux

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
